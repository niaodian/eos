name: EOS CI
# Local-first CI. Runnable with `act` (nektos/act) — no cloud runner required:
#   act push            # run the whole workflow locally in Docker
#   act -j verify       # run just the verify job
#   act -l              # list jobs (fast, no Docker execution)
#
# PREREQUISITE: Docker must be running. FIRST RUN needs network ONCE to pull a runner
# image (~500MB) + the actions (checkout, setup-node); they are cached under ~/.cache/act
# and ~/Library/Containers/com.docker.*, so EVERY LATER RUN is fully offline:
#   act push --pull=false --action-offline-mode
# No Docker? Skip CI and run the same checks directly (see docs/eos/quickstart.md Prerequisites):
#   node .github/hooks/validate-config.mjs && node .github/hooks/check-doc-parity.mjs \
#     && node .github/hooks/eos-doctor.mjs && node .github/hooks/project-gate.mjs
# This is the batch, whole-repo gate (complements per-edit hooks + validate-config.mjs).
#
# NON-NODE STACKS: the product-quality step below runs whatever `.eos/project.json` declares, so a
# Python/Go/Java/Rust/.NET project's tests DO run and DO fail CI. Add your toolchain's setup step
# (actions/setup-python, setup-go, setup-java, dtolnay/rust-toolchain, setup-dotnet…) before it —
# a missing toolchain is reported as BLOCKED and fails, it is never silently skipped.
#
# SUPPLY CHAIN (EOS-AUD-009): every action is pinned to an immutable commit SHA with the
# human-readable version in a trailing comment. A tag is a moving pointer its owner can repoint at
# any commit; a SHA is the code that was reviewed. Update them deliberately:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# Pinned at v7, which runs on the node24 runtime: the v4 pins still worked, but GitHub forced them
# onto node24 anyway and warned on every run, so the pin no longer described what actually ran.

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege by default; a job that needs more asks for it in its own `permissions:` block.
# `pull_request` (not `pull_request_target`) is used deliberately: a fork PR runs WITHOUT repository
# secrets and with a read-only token, so untrusted code never reaches a writable context.
permissions:
  contents: read

# One run per ref: an older run for the same branch is superseded rather than left racing the new
# one — except on the default branch, where every commit keeps its own verdict.
concurrency:
  group: eos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ledger check below compares against the base/previous ref, so the shallow default
          # would make it unverifiable on exactly the changes it exists to police.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: EOS config validation (S1–S13)
        run: node .github/hooks/validate-config.mjs

      - name: EOS doc parity (zh ⇄ en lockstep — structure + factual codes)
        # English is the reference language; every docs/eos/<f>.md must have a docs/zh/<f>.md
        # (+ README ⇄ README.zh) with matching structure + S/G/P/D/R codes + versions. Blocks
        # an en-only edit from silently drifting the Chinese tree out of parity.
        run: node .github/hooks/check-doc-parity.mjs

      - name: EOS SDLC gate doctor (G-EVAL / G-UX wiring + BMAD runtime + secret hygiene)
        # --deep also verifies that every MAPPED BMAD skill can actually activate here (project
        # runtime + executables). Without it a directory-name check reports PASS for skills that
        # fail on their first activation step. [EOS-AUD-002]
        run: node .github/hooks/eos-doctor.mjs --deep

      - name: EOS secret scan (built-in patterns + gitleaks if available)
        run: node .github/hooks/secret-scan.mjs

      - name: EOS spec-alignment (advisory — AC coverage / first-pass rate)
        run: node .github/hooks/spec-align.mjs

      # ---------------------------------------------------------------------------------------
      # TEST LAYERS. Each step runs one layer in a SINGLE `node --test` invocation, so Node
      # parallelises the files across cores, and each step reports its own duration plus a budget
      # check. This replaced ~15 one-file-per-step invocations that ran strictly sequentially and
      # were gated by a single 1,246-line file (38.3s of a 38.7s run). Layers + the split brought
      # the full suite from 38.7s to ~16s while ADDING tests.
      #
      # A layer that exceeds its budget in .eos/test-budget.json FAILS: a suite degrades one
      # plausible second at a time, and the commit that caused it is the only affordable moment to
      # fix it. On a slow runner scale the budget (EOS_TEST_BUDGET_SCALE) rather than raising it.
      - name: EOS tests · unit (pure logic, atomic writes, single-module behaviour)
        run: node .github/eos/run-tests.mjs unit

      - name: EOS tests · contract (CLI JSON + exit codes, adapter contract, offline boundary)
        run: node .github/eos/run-tests.mjs contract

      - name: EOS tests · integration (routing, gate bypasses, cross-stack quality, doctor)
        run: node .github/eos/run-tests.mjs integration

      - name: EOS tests · journey (the whole developer loop, end to end, offline)
        run: node .github/eos/run-tests.mjs journey

      - name: EOS tests · audit regressions (one executable case per audit finding)
        # Each test performs the reported bypass — relabelling, an outlived waiver, a tampered or
        # truncated ledger, hand-written evidence, a story added after a release gate, a forked
        # ledger from concurrent writers — and asserts it no longer works.
        run: node .github/eos/run-tests.mjs audit-regression

      - name: EOS ledger append-only verification
        # The hash chain is the offline guarantee; comparing against the base ref additionally
        # proves that no previously recorded line was rewritten in this change.
        run: |
          node .github/eos/eos.mjs ledger --verify
          # Compare against whatever this build is built ON TOP OF: the PR base on a pull_request,
          # the previous commit on a push. A push build used to skip this entirely, which is exactly
          # where a rewritten ledger would land.
          REF=""
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF" || true
            REF="origin/$GITHUB_BASE_REF"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_EVENT_BEFORE" || true
            REF="$GITHUB_EVENT_BEFORE"
          fi
          if [ -n "$REF" ]; then
            node .github/eos/eos.mjs ledger --verify --against "$REF" || exit 1
          else
            echo "no base ref available (first push) — the hash chain + head record are the guarantee here"
          fi
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: EOS guided-workflow self-check (is EOS itself wired correctly?)
        run: node .github/eos/eos.mjs doctor

      - name: Product quality gate + evals (declared in .eos/project.json — every stack)
        # Runs the PROJECT's own install/lint/typecheck/test/eval commands for whatever stack it
        # declares. Replaces the old `if [ -f package.json ]` branch, which silently skipped
        # Python/Go/Java/Rust/.NET projects so their failing tests could never fail CI. [audit EOS-002]
        #
        # This DELIBERATELY re-executes the test layers above. The steps above exist for fast,
        # granular feedback (a red step names the layer); this step proves the DECLARED command in
        # .eos/project.json actually runs and passes. EOS requires that of every other project, so
        # it has to hold itself to it — a declaration nobody executes is exactly the vacuous green
        # this gate exists to refuse. The overlap costs ~30s of a 20-minute budget.
        run: node .github/hooks/project-gate.mjs

      - name: EOS gate summary (published to the PR / run summary)
        # Always runs, even when a step above failed, so the summary explains WHY the run is red
        # and what the single next action is — instead of "see the logs".
        if: always()
        run: |
          {
            echo "## EOS gate summary"
            echo ""
            echo '```'
            node .github/eos/eos.mjs status || true
            echo '```'
            echo ""
            echo "### Recommended next action"
            echo '```'
            node .github/eos/eos.mjs next || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # Candidate-bound release verification. `verify` proves THE CHANGE is sound; this proves THE THING
  # BEING SHIPPED is. It re-runs the declared quality commands on the tag's own tree and requires
  # every included story's verification to describe THAT tree — story state is not evidence about
  # code. [EOS-AUD-001 / EOS-AUD-007]
  release-candidate:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Candidate product-tree identity
        run: node .github/eos/eos.mjs product-tree

      - name: Does this repository release a product?
        id: releasable
        # EOS's own repository declares `config-only` — it ships governance, not a product — so the
        # release gate has nothing to test and correctly reports BLOCKED. Running it anyway would
        # make every tag red for a reason that is not a defect. Downstream product repositories
        # declare `application`/`library` and DO run the gate below.
        run: |
          TYPE=$(node -e "try{process.stdout.write(require('./.eos/project.json').projectType||'')}catch{process.stdout.write('')}")
          echo "projectType=$TYPE"
          if [ "$TYPE" = "application" ] || [ "$TYPE" = "library" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::projectType is '${TYPE:-unset}' — there is no product to release-verify. Declare application/library in .eos/project.json to enable the candidate-bound release gate."
          fi

      - name: Install the declared toolchain for the candidate
        if: steps.releasable.outputs.run == 'true'
        # This is a FRESH job: it does not inherit the `verify` job's dependencies, so the declared
        # install must run before the release gate executes the quality commands with --skip-install.
        run: node .github/hooks/project-gate.mjs

      - name: Candidate-bound release verification (G8)
        if: steps.releasable.outputs.run == 'true'
        # The FULL release gate on this tag: quality commands on the candidate tree, story evidence
        # bound to it, spec alignment, secret scan, dependency audit, NFR evidence, compliance
        # boundary, waivers, runbook/rollback/canary/health, topology, enforcement authority.
        # A network-dependent step is DEFERRED, never PASS.
        run: node .github/eos/eos.mjs verify-release --release "${GITHUB_REF_NAME}"

      - name: Release gate summary
        if: always() && steps.releasable.outputs.run == 'true'
        run: |
          {
            echo "## EOS release gate — ${GITHUB_REF_NAME}"
            echo ""
            echo '```'
            node .github/eos/eos.mjs release-status --release "${GITHUB_REF_NAME}" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
